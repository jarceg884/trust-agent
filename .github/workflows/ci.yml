# CI mínimo del piloto (t_b62edff2): valida el compose y escanea secretos.
# 1. compose-config: docker-compose.yml parsea en ambos perfiles (dev + litellm).
# 2. gitleaks: NINGÚN valor de secret en el repo (constitution IV) — el
#    escaneo cubre toda la historia de commits del PR.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  compose-config:
    name: compose config valida (dev + litellm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        env:
          # Secretos obligatorios sin default: dummies SOLO para validar el
          # parseo (el stack real exige valores fuertes, fail-closed).
          TRUST_DEVICE_TOKEN_SECRET: ci-dummy-not-a-secret
          TRUST_VAULT_KEK_B64: ci-dummy-not-a-secret
          TRUST_POLICY_JWS_PRIVATE_KEY_B64: ci-dummy-not-a-secret
          TRUST_PROVIDER_TOKEN: ci-dummy-not-a-secret
          KC_ADMIN_PASSWORD: ci-dummy-not-a-secret
        run: |
          docker compose config -q
          docker compose --profile litellm config -q
          echo "compose config OK (default + litellm)"

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
