name: trust-agent-governance
version: 0.6.0
description: "Trust Agent governance bridge v2 (spec 019 + 022 + 027 seam): the signed governance bundle (JWS RS256, aud=device_id, offline grace) is the single local authority. Syncs GET /api/me/governance-bundle at startup and periodically, verifies signature/aud/exp/jti against the pinned public key, exposes governance_status from the verified cache, injects per-turn governance context with the precedence clause, and pins the governed identity as a system prompt section (after_memory). Reports presence via POST /api/me/device-heartbeat each sync cycle (applied policy_version, uptime, mode) and re-pulls the bundle in the same cycle when the control plane signals policy_update_available — live policy propagation without restart or re-enrollment. Spec 022 adds ZERO-UI auto-enrollment (first run with the org binding from the download link enrolls automatically — no enrollment screens; /trust-enroll remains as headless recovery), the pre_tool_call veto by allowed_tools (deny-by-default, covers MCP/deferred/delegated tools) and fail-closed restricted modes (offline grace, revoked device). v0.5.0 (spec 019 D-GOH-11): versioned extensible bundle schema — schema_version claim, every catalog policy key travels flattened in the payload, unknown keys/schema are ignored-but-never-relaxed with a local warning, and absent keys resolve to the plugin's RESTRICTIVE_DEFAULTS (deny-by-default, REQ-GOH-022/023/024). v0.6.0 (capability batch 2, t_a868974a): capability-level enforcement — MCP servers, plugins, skills catalog, memory providers, browser credential vault + payment autofill, personality lock (prompt section + /personality interception), voice/bot-mode/recurring/goal commands, scheduled tasks, delegation depth, profile distributions, computer_use bounded (E-2), session-retention prune + checkpoints floor via managed scope (P-27/P-28), config-vs-policy deviations and floors reported through the attestation capability_findings channel. Desktop = Hermes configured, never a patched fork (constitution IV / lesson C6)."
author: "trust-agent (t_d3768316, spec 019 t_f99e12ab + spec 022 t_c875626f + schema extensible t_150e8931)"
provides_hooks:
  - pre_llm_call
  - pre_tool_call
