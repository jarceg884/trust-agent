# Alembic wrapper for the control plane.
# The canonical migration project lives in db/migrations (owner: spec 002).
# There is NO second migration lineage: this config only points at it (D-CP-11).
[alembic]
script_location = %(here)s/../db/migrations
# URL comes from the DATABASE_URL environment variable (see db/migrations/env.py).
sqlalchemy.url = driver://user:pass@localhost/dbname
