[project]
name = "trust-agent-platform"
version = "0.1.0"
description = "Trust Agent control plane: FastAPI + SQLAlchemy over the multi-tenant schema (spec 003)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43.0",
    "httpx>=0.27",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
verify-audit-chain = "app.audit.cli:main"
trust-provision = "app.tenants.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = ["pytest>=8.3"]
