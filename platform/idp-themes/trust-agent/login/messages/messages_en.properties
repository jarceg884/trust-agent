# Trust Agent white-label message overrides (spec 015 D-AUTH-01).
#
# Only the keys whose KC 26 defaults read like Keycloak jargon on the TOTP
# enrollment page ("Mobile Authenticator Setup", "OTP devices", barcode
# wording). Missing keys fall back to the parent theme (keycloak.v2 → base),
# so this file stays minimal on purpose. Per-tenant product names ride REALM
# localization overrides instead (KeycloakAdminClient.ensure_login_theme →
# POST /admin/realms/{r}/localization/en) — theme bundles cannot interpolate
# the realm display name into keys the templates call without arguments.
loginTotpTitle=Two-factor authentication
configureTotpMessage=Set up two-factor authentication to activate your account.
loginTotpStep1=Install an authenticator app on your phone:
loginTotpStep2=Open the app and scan this code:
loginTotpStep3=Enter the one-time code the app shows to finish the setup.
loginTotpStep3DeviceName=Give this device a name so you can recognize it later.
loginTotpDeviceName=Device name
loginTotpManualStep2=Open the app and enter this key:
loginTotpManualStep3=If the app asks for these settings, use:
# PITFALL (verified live): values are formatted MessageFormat-style — a
# literal apostrophe must be doubled ("Can''t"); a single one is dropped.
loginTotpUnableToScan=Can''t scan the code?
loginTotpScanBarcode=Scan the code instead?
