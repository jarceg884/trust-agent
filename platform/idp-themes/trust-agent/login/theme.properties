# Trust Agent white-label login theme (spec 015 D-AUTH-01).
#
# keycloak.v2 is the KC 26 default theme (PatternFly v5 via stylesCommon,
# inherited from the parent). `styles` is re-declared to keep the parent's
# stylesheet AND layer our brand on top — theme properties do not merge
# space-separated lists, so the parent entry is listed explicitly (resource
# lookup falls back to the parent theme for files the child does not ship).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/trust.css
